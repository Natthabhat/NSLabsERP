services:
  erp:
    image: nslabs-erp:local
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3400:3000"
      - "192.168.31.36:3400:3000"
    env_file:
      - .env.production
    volumes:
      - shopee-orders:/var/lib/nslabs-shopee:ro
    networks:
      - database
      - automation
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    cap_drop:
      - ALL

networks:
  automation:
    external: true
    name: n8n_default
  database:
    external: true
    name: nslabs-db-admin
volumes:
  shopee-orders:
    external: true
    name: nslabs-shopee-orders
