services:
  erp:
    image: nslabs-erp:local
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3400:3000"
      - "192.168.31.36:3400:3000"
    env_file:
      - .env.production
    networks:
      - database
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    cap_drop:
      - ALL

networks:
  database:
    external: true
    name: nslabs-db-admin
