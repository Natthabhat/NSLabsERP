services:
  shopee-browser:
    build: .
    image: nslabs-shopee-browser:local
    container_name: shopee-browser
    restart: unless-stopped
    init: true
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2
    volumes:
      - shopee-data:/data
      - orders-export:/export
    networks:
      - n8n
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
networks:
  n8n:
    external: true
    name: n8n_default
volumes:
  shopee-data:
  orders-export:
    name: nslabs-shopee-orders
